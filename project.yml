name: LexiNote
options:
  bundleIdPrefix: com.zhujf
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: NO
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
targets:
  LexiNote:
    type: application
    platform: macOS
    sources:
      - path: LexiNote
      - path: Licenses/ECDICT-LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhujf.LexiNote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: LexiNote
  LexiNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LexiNoteTests
    dependencies:
      - target: LexiNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhujf.LexiNoteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LexiNote.app/Contents/MacOS/LexiNote"
        BUNDLE_LOADER: "$(TEST_HOST)"
